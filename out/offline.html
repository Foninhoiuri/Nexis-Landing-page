<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão — NexisHub</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #2563EB;
      --bg: #030303;
      --surface: #0a0a0a;
      --border: rgba(255,255,255,0.08);
      --text: #ffffff;
      --muted: #71717a;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .container {
      max-width: 480px;
      width: 100%;
    }

    .icon-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.1);
      border: 1px solid rgba(37, 99, 235, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
    }

    .icon-wrap svg {
      width: 36px;
      height: 36px;
      color: var(--brand);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      background: var(--brand);
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      text-decoration: none;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .logo {
      width: 100px;
      height: auto;
      margin: 0 auto 2.5rem;
      display: block;
      opacity: 0.8;
    }

    .status {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 6px;
      vertical-align: middle;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/nexis_logo.png" alt="NexisHub Logo" class="logo" width="100" height="40" />

    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
        <path d="M13 13l6 6"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </div>

    <h1>Sem conexão com a internet</h1>
    <p>
      Parece que você está offline. Verifique sua conexão Wi-Fi ou dados móveis
      e tente novamente.
    </p>

    <button class="btn" onclick="window.location.reload()" aria-label="Tentar reconectar">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M2.5 22v-6h6"/>
        <path d="M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
      </svg>
      Tentar novamente
    </button>

    <div class="status">
      <span class="dot"></span>
      Sem conexão
    </div>
  </div>

  <script>
    // Auto-retry quando a conexão voltar
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
